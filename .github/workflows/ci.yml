name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --statistics

      - name: Run unit tests (no external services)
        run: |
          pytest tests/ \
            -m "not integration" \
            --timeout=30 \
            -q \
            --tb=short
        env:
          # Dummy values so config loading doesn't fail; service checks are skipped
          OPENAI_API_KEY: "sk-test-dummy"
          ANTHROPIC_API_KEY: "sk-ant-dummy"
          HEPHAESTUS_SKIP_SERVICE_CHECKS: "true"
